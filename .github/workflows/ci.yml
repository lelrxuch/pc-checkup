name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # Prueba de humo: recolecta datos reales del runner. En Windows es la
      # única verificación automática de las consultas WMI.
      - name: Smoke test
        shell: bash
        run: |
          cargo build --release
          target/release/pc-checkup --json > report.json
          target/release/pc-checkup --no-open -o report.html
          test -s report.json && test -s report.html

      - uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ matrix.os }}
          path: |
            report.json
            report.html
          retention-days: 7
